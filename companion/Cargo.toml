[package]
name = "companion"
version = "0.2.1"
edition = "2024"

[dependencies]
eframe = { version = "0.35", default-features = false, features = ["default_fonts", "glow", "x11"] }
egui = "0.35"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
semver = "1"
image = { version = "0.25", default-features = false, features = ["png"] }
lovense = { path = "../lovense" }
steamlocate = "2.1"
serde = { version = "1", features = ["derive"] }
thiserror = "2"
rand = "0.9"
serde_json = "1"
dirs = "6"
tempfile = "3"
log = "0.4"
env_logger = "0.11"
egui-phosphor = "0.13.0"
buttplug_client = "11"
buttplug_core = "11"
buttplug_transport_websocket_tungstenite = "11"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync"] }

[target.'cfg(any(target_os = "windows", target_os = "macos", target_os = "linux"))'.dependencies]
buttplug_client_in_process = "11"
buttplug_server = "11"
buttplug_server_device_config = "11"
buttplug_server_hwmgr_btleplug = "11"
buttplug_server_hwmgr_lovense_connect = "11"
buttplug_server_hwmgr_lovense_dongle = "11"
buttplug_server_hwmgr_websocket = "11"

[target.'cfg(windows)'.dependencies]
buttplug_server_hwmgr_xinput = "11"
winreg = "0.56"
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem", "Win32_Foundation"] }

